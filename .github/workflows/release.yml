name: Release Portable Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to. Empty means latest release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            archive: zip
            torch_index: https://download.pytorch.org/whl/cu128
          - os: ubuntu-22.04
            platform: Linux
            archive: tar.gz
            torch_index: https://download.pytorch.org/whl/cu128

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} GPU

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libsndfile1 fonts-dejavu-core

      - name: Build frontend
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url "${{ matrix.torch_index }}"
          pip install git+https://github.com/ideogram-oss/ideogram4.git

      - name: Download Ideogram 4 NF4 weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/download_ideogram_weights.py --repo-id ideogram-ai/ideogram-4-nf4 --cache-dir models/hf-cache

      - name: Run tests
        run: pytest -q

      - name: Build executable
        run: pyinstaller Ideogram4Generator.spec

      - name: Create Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "Ideogram4Generator-Windows-GPU-Portable"
          Move-Item -LiteralPath "dist\Ideogram4Generator" -Destination "dist\$name"
          @"
          Ideogram 4 Generator Windows GPU 便携版

          使用方法：
            双击 Ideogram4Generator.exe
            浏览器访问 http://127.0.0.1:7860

          说明：
            内置 Ideogram 4 NF4 权重缓存和 CUDA 版 PyTorch。
            需要兼容 CUDA 的 NVIDIA 显卡；不满足条件会显式报错。
          "@ | Set-Content -LiteralPath "dist\$name\使用说明.txt" -Encoding UTF8
          Compress-Archive -Path "dist\$name" -DestinationPath "$name.zip" -Force

      - name: Create Linux package
        if: runner.os == 'Linux'
        run: |
          name="Ideogram4Generator-Linux-GPU-Portable"
          mv "dist/Ideogram4Generator" "dist/${name}"
          chmod +x "dist/${name}/Ideogram4Generator"
          cat > "dist/${name}/使用说明.txt" <<'TXT'
          Ideogram 4 Generator Linux GPU 便携版

          使用方法：
            chmod +x Ideogram4Generator
            ./Ideogram4Generator
            浏览器访问 http://127.0.0.1:7860

          说明：
            内置 Ideogram 4 NF4 权重缓存和 CUDA 版 PyTorch。
            需要兼容 CUDA 的 NVIDIA 显卡；不满足条件会显式报错。
          TXT
          tar -czf "${name}.tar.gz" -C dist "${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Ideogram4Generator-${{ matrix.platform }}-GPU
          path: Ideogram4Generator-${{ matrix.platform }}-GPU-Portable*

  upload-release:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Determine target tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            latest=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
            echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update release notes
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --notes "Preparing release assets..."
          fi
          cat > release-notes.md <<'NOTES'
          ## Ideogram 4 Generator

          ### Portable builds

          | File | Platform | Runtime |
          |------|----------|---------|
          | `Ideogram4Generator-Windows-GPU-Portable.zip` | Windows 10/11 x64 | CUDA GPU, Ideogram 4 NF4 |
          | `Ideogram4Generator-Linux-GPU-Portable.tar.gz` | Linux x64 | CUDA GPU, Ideogram 4 NF4 |

          The release job downloads the gated Ideogram 4 weights with `HF_TOKEN`.
          If the token is missing or the model license has not been accepted, the job fails explicitly.
          NOTES
          gh release edit "$tag" --repo "${{ github.repository }}" --title "$tag" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          mapfile -t files < <(find . -maxdepth 1 -name 'Ideogram4Generator-*-GPU-Portable*' -type f | sort)
          for file in "${files[@]}"; do
            gh release upload "$tag" "$file" --repo "${{ github.repository }}" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Portable Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要上传资源的 Release 标签（如 v0.1.1），留空则上传到最新 Release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Determine target tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            latest=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
            if [ -z "$latest" ]; then
              echo "No release tag was provided and no existing release was found."
              exit 1
            fi
            echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release if missing
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "${TAG}" \
              --notes "正在准备发布说明..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cat > release-notes.md << NOTES
          ## Ideogram 4 Generator ${TAG}

          ### 便携版下载

          | 文件 | 平台 | 推理方式 | 说明 |
          |------|------|----------|------|
          | \`Ideogram4Generator-Windows-GPU-CUDA-NF4-Portable.*\` | Windows 10/11 x64 | GPU (CUDA 12.8, NF4) | 有 NVIDIA 显卡推荐 |
          | \`Ideogram4Generator-Linux-GPU-CUDA-NF4-Portable.*\` | Linux x64 | GPU (CUDA 12.8, NF4) | 有 NVIDIA 显卡推荐 |

          ### 使用方法
          1. 下载对应平台的 GPU 压缩包
          2. Windows 请下载同名前缀的全部 \`.7z.00x\` 分卷，并从 \`.7z.001\` 解压
          3. Linux 请下载同名前缀的全部 \`.tar.part*\` 分卷，执行 \`cat Ideogram4Generator-Linux-GPU-CUDA-NF4-Portable.tar.part* > Ideogram4Generator-Linux-GPU-CUDA-NF4-Portable.tar && tar -xf Ideogram4Generator-Linux-GPU-CUDA-NF4-Portable.tar\`
          4. 运行 \`Ideogram4Generator\`（Windows 为 \`.exe\`）即可使用

          ### 说明
          - 无需安装 Python，解压即用
          - Release 产物包含 \`ideogram-ai/ideogram-4-nf4\` 模型缓存，运行时不再触发模型下载
          - GPU 版内含 CUDA 12.8 PyTorch 运行时
          - 官方接口只用于 Magic Prompt 提示词优化；图片由本地 CUDA 生成
          - 没有 NVIDIA 显卡，或当前显卡与内置 PyTorch/CUDA 不兼容时会显式报错；发布流程不生成 CPU 版
          - \`ideogram-ai/ideogram-4-nf4\` 为 gated 模型仓库，权重和配置文件不能匿名下载；\`HF_TOKEN\` 只作为 GitHub Actions secret 注入模型下载与缓存清理步骤，不会写入仓库、README、Release Notes 或打包产物

          ### 系统要求
          - **Windows**：Windows 10/11 (x64)
          - **Linux**：Ubuntu 20.04+ / Debian 11+ (x64)
          - **GPU 版**：与内置 PyTorch/CUDA 兼容的 NVIDIA 显卡
          - **显存/内存**：建议 16GB 显存与 16GB+ 内存
          NOTES
          gh release edit "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "${TAG}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [prepare-release]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            variant: GPU
            pytorch_url: https://download.pytorch.org/whl/cu128
          - os: ubuntu-22.04
            platform: Linux
            variant: GPU
            pytorch_url: https://download.pytorch.org/whl/cu128

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}-${{ matrix.variant }} CUDA NF4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libsndfile1 fonts-dejavu-core

      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null 2>&1; then
            docker system prune -af
          fi
          df -h .

      - name: Verify model download token is configured
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN repository secret is required for release bundles."
            echo "Accept the ideogram-ai/ideogram-4-nf4 license on Hugging Face and add a token as the HF_TOKEN secret."
            exit 1
          fi

      - name: Build frontend
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Install Python and CUDA dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url ${{ matrix.pytorch_url }}
          pip install git+https://github.com/ideogram-oss/ideogram4.git

      - name: Clear package caches before model bundling
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip cache purge
          rm -rf "$HOME/.cache/pip" "$HOME/.cache/torch"
          df -h .

      - name: Download Ideogram 4 NF4 weights into bundle cache
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_XET: "1"
        run: python tools/download_ideogram_weights.py --repo-id ideogram-ai/ideogram-4-nf4 --cache-dir models/hf-cache

      - name: Sanitize Hugging Face cache before packaging
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/sanitize_hf_cache.py --cache-dir models/hf-cache

      - name: Verify bundled model cache exists
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cache = Path("models/hf-cache/hub")
          files = [p for p in cache.rglob("*") if p.is_file()]
          if not files:
              raise SystemExit("models/hf-cache/hub is empty; release bundle would not include the model.")
          print(f"model cache files: {len(files)}")
          PY

      - name: Verify no token material is staged for release
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/sanitize_hf_cache.py --cache-dir models/hf-cache

      - name: Run tests
        run: pytest -q

      - name: Server self-test
        run: python run.py --self-test

      - name: Build executable with strict GPU dependency collection
        env:
          IDEOGRAM_STRICT_BUNDLE: "1"
        run: pyinstaller Ideogram4Generator.spec

      - name: Create portable package
        shell: bash
        run: |
          NAME="Ideogram4Generator-${{ matrix.platform }}-${{ matrix.variant }}-CUDA-NF4"
          PKG="${NAME}-Portable"
          mkdir -p "${PKG}"
          cp -r dist/Ideogram4Generator/* "${PKG}/"
          cp README.md "${PKG}/"
          cp LICENSE "${PKG}/"

          if [ "${{ matrix.platform }}" = "Windows" ]; then
            EXE_NAME="Ideogram4Generator.exe"
            cat > "${PKG}/使用说明.txt" << HEREDOC
          Ideogram 4 Generator ${{ matrix.platform }} 便携版（${{ matrix.variant }} CUDA NF4）

          使用方法：
            双击 ${EXE_NAME} 启动
            浏览器访问 http://127.0.0.1:7860

          说明：
            Release 产物包含 ideogram-ai/ideogram-4-nf4 模型缓存，运行时不再触发模型下载
            无需安装 Python，解压即用
            内置 CUDA 12.8 PyTorch 运行时
            需要与内置 PyTorch/CUDA 兼容的 NVIDIA 显卡
            官方接口只用于 Magic Prompt 提示词优化；图片由本地 CUDA 生成
          HEREDOC
          else
            EXE_NAME="Ideogram4Generator"
            chmod +x "${PKG}/${EXE_NAME}"
            cat > "${PKG}/使用说明.txt" << HEREDOC
          Ideogram 4 Generator ${{ matrix.platform }} 便携版（${{ matrix.variant }} CUDA NF4）

          使用方法：
            chmod +x ${EXE_NAME}
            ./${EXE_NAME}
            浏览器访问 http://127.0.0.1:7860

          说明：
            Release 产物包含 ideogram-ai/ideogram-4-nf4 模型缓存，运行时不再触发模型下载
            无需安装 Python，解压即用
            内置 CUDA 12.8 PyTorch 运行时
            需要与内置 PyTorch/CUDA 兼容的 NVIDIA 显卡
            官方接口只用于 Magic Prompt 提示词优化；图片由本地 CUDA 生成
          HEREDOC
          fi

      - name: Smoke test portable package
        shell: bash
        run: |
          NAME="Ideogram4Generator-${{ matrix.platform }}-${{ matrix.variant }}-CUDA-NF4"
          PKG="${NAME}-Portable"
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            "./${PKG}/Ideogram4Generator.exe" --self-test
          else
            "./${PKG}/Ideogram4Generator" --self-test
          fi

      - name: Compress portable package
        shell: bash
        run: |
          NAME="Ideogram4Generator-${{ matrix.platform }}-${{ matrix.variant }}-CUDA-NF4"
          PKG="${NAME}-Portable"
          echo "压缩前磁盘空间:"
          df -h .
          rm -rf build
          rm -rf "$HOME/.cache/pip" "$HOME/.cache/torch"
          echo "清理构建缓存后磁盘空间:"
          df -h .

          if [ "${{ matrix.platform }}" = "Windows" ]; then
            7z a -t7z -mx=0 -mmt=on -v1900m "${PKG}.7z" "${PKG}"
            7z t "${PKG}.7z.001"
            sha256sum "${PKG}".7z.* > "${PKG}.sha256"
          else
            tar -cf - "${PKG}" | split -b 1900M - "${PKG}.tar.part"
            sha256sum "${PKG}".tar.part* > "${PKG}.sha256"
          fi

      - name: Upload assets to release
        shell: bash
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          echo "上传资源到 Release: ${TAG}"
          mapfile -t FILES < <(find . -maxdepth 1 -name "Ideogram4Generator-${{ matrix.platform }}-${{ matrix.variant }}-CUDA-NF4-Portable*" -type f | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release assets were produced."
            exit 1
          fi

          upload_asset_with_retry() {
            local tag="$1"
            local file="$2"
            local attempt
            local exit_code

            for attempt in 1 2 3; do
              echo "上传(${attempt}/3): ${file}"
              if timeout 30m gh release upload "${tag}" "${file}" \
                --repo "${{ github.repository }}" \
                --clobber; then
                return 0
              fi

              exit_code=$?
              echo "上传失败(退出码=${exit_code}): ${file}"
              if [ "${attempt}" -lt 3 ]; then
                sleep $(( attempt * 20 ))
              fi
            done

            echo "上传最终失败: ${file}"
            return 1
          }

          echo "找到以下文件："
          for file in "${FILES[@]}"; do
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            echo "  $file ($(( SIZE / 1048576 )) MB)"
          done

          for file in "${FILES[@]}"; do
            upload_asset_with_retry "${TAG}" "$file"
          done
          echo "全部上传完成"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
